name: verify

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  decomp-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/generate_decomp_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: SLUS-00739_report
          path: build/report.json
          if-no-files-found: error

  report-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_decomp_report tests.test_matching_manifest -v
